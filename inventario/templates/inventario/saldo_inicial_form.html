{% extends "base.html" %}

{% block title %}Configurar saldo inicial · Desarmaduría{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Configurar saldo inicial</h1>
</div>

<div class="form-card">
    <form method="post" class="form">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
            <p class="form-error">{{ field.errors|join:", " }}</p>
            {% endif %}
        </div>
        {% endfor %}

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="{% url 'reporte_caja' %}" class="btn">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
